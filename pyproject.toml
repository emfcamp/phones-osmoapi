[project]
name = "phones-osmoapi"
version = "0.1.0"
description = "HTTP API for osmocom"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "osmoapi",
    "telnetlib3>=4.0.2",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.uv.sources]
osmoapi = { url = "https://github.com/emfcamp/phones-osmoapi-py/releases/download/v0.1.1/osmoapi-0.1.1-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[tool.ruff]
line-length = 150