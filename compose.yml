services:
  osmoapi-prod:
    container_name: osmoapi
    image: ghcr.io/emfcamp/phones-osmoapi
    profiles: [ prod ]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    network_mode: "host"
  osmoapi-dev:
    container_name: osmoapi-dev
    profiles: [ dev ]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"