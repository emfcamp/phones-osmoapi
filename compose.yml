services:
  osmoapi-prod:
    container_name: osmoapi
    image: ghcr.io/emfcamp/phones-osmoapi
    profiles: [ prod ]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      - DATA_DIR=/data
      - LOGS_DIR=/logs
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/opt/osmoapi/data:/data:rw"
      - "/opt/osmoapi/logs:/logs:rw"
      # osmo-hlr's DB, for the read-only /hlr/db/* endpoints (path: HLR_DB_PATH)
      - "/var/lib/osmocom:/var/lib/osmocom:ro"
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    profiles: [ prod ]
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      - osmoapi-prod
  osmoapi-dev:
    container_name: osmoapi-dev
    profiles: [ dev ]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"

volumes:
  caddy_data:
  caddy_config: