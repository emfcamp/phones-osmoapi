services:
  osmoapi-prod:
    container_name: osmoapi
    image: ghcr.io/emfcamp/phones-osmoapi
    profiles: [ prod ]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      - DATA_DIR=/data
      - LOGS_DIR=/logs
    network_mode: "host"
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/opt/osmoapi/data:/data:rw"
      - "/opt/osmoapi/logs:/logs:rw"
  osmoapi-dev:
    container_name: osmoapi-dev
    profiles: [ dev ]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"